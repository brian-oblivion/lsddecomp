# LSD: Dream Emulator (PSX, 1998, Asmik Ace / OutSide Directors Company)
# Japanese retail release, SLPS-01556.
#
# THE SEGMENTATION BELOW IS INHERITED FROM FirecatFG's lsddecomp
# (github.com/FirecatFG/lsddecomp) -- see CREDITS.md. It is a set of empirical
# facts about this executable (where the psyq library blocks start, where the
# rodata slots sit, where the game's own code begins), not authored source, and
# it is the single biggest head start this project has.
#
# ADDRESSING. This is a plain PS-X EXE: a 0x800-byte header followed by one
# contiguous image loaded at 0x80010000. So
#
#     file offset = vram - 0x80010000 + 0x800
#
# and the whole file is 0x7B800 bytes. There is no compression, no overlay and
# no bank switching -- every byte of code in the game is in this one file.
name: LSD Dream Emulator
sha1: 76322eeade5ebb22dca57fdeac7d68c30f06308d
options:
  basename: lsdde
  platform: psx
  compiler: GCC

  base_path: ..
  target_path: disk/SLPS_015.56
  asm_path:    asm/
  asset_path:  assets/
  src_path:    src/
  o_path:      lib/        # prebuilt Psy-Q library objects (converted from the SDK by tools/setup.sh)
  symbol_addrs_path: config/symbols.slps01556.lsdde.txt
  undefined_funcs_auto_path:   config/undefined_funcs_auto.slps01556.lsdde.txt
  undefined_syms_auto_path:    config/undefined_syms_auto.slps01556.lsdde.txt
  ld_script_path: lsdde.ld

  find_file_boundaries: False
  pair_rodata_to_text: False
  migrate_rodata_to_functions: True
  gp_value: 0x8008A808

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    align: 4
    subsegments:
      # ---- rodata slots, paired by hand to the text blocks below ----------
      # The 0x800 slot is tiled exactly by four SDK objects as psyq_2258 is
      # converted; the trailing plain `rodata` line shrinks each time a chunk
      # lands its piece and disappears when libgte/geo takes 0xA68.
      - [0x800, o, libgs/matrix, .rdata]      # print_matrix/print_vector formats
      - [0x830, o, libc2/prnt, .rdata]        # printf's format-dispatch jump tables
      - [0xA3C, o, libgs/2d_com1, .rdata]     # "z resolution overflow", 0x2A
      # The string ends at 0xA66 and retail aligns the jump table after it to
      # 4 (splat's own disassembly emits `.align 2` right here). 0xA66 is
      # already 2-aligned, so SUBALIGN(2) would NOT insert those two bytes.
      - [0xA66, pad]
      # jtbl_80010268: geo's own switch jump table, 9 relocated words. A raw
      # byte search cannot find relocated words, so `place` says
      # `bytes:not-found`; the derived 0xA68 landing on the slot's existing
      # dlabel is the confirmation. The 0x800 slot is now tiled exactly and
      # psyq_2258 owns no plain rodata at all.
      - [0xA68, o, libgte/geo, .rdata]
      - [0xA8C, rodata]   # code_8220
      - [0xABC, rodata]   # psyq_GsLinkObject4 (D_800102BC, jtbl_800102DC)
      # jtbl_80010354 is TmdModel.c's switch table: `.L` labels local to its
      # function's own `.s`, so the sub-slot is ATTACHED (Gate 2). 0x80 bytes.
      - [0xB54, .rodata, graphics/TmdModel]
      - [0xBD4, rodata]   # 0xEBC..0xF25 is libetc/intr's .rdata, SHADOWED (see the manifest)
      - [0xF28, o, libetc/intr_dma, .rdata]   # "DMA bus error" strings
      - [0xF54, o, libetc/vsync, .rdata]      # "VSync: timeout"
      - [0xF64, rodata]   # Pad's sDefaultButtonMasks (src/Pad.c): the only object between vsync and 0xFA4 that can own rodata
      - [0xFA4, rodata]   # GameApplicationFileResource
      # 0xFD8 slot, SPLIT at 0x1010 by ownership (round 47 carve of
      # code_179d8_s).  The two strings belong to OTHER units --
      # D_800107D8 is %hi-taken by code_179d8_q, D_800107F4 by
      # code_179d8_h -- so they stay STANDALONE; a dlabel symbol resolves
      # from a standalone rodata object.  The two jump tables hold `.L`
      # labels local to func_80027A24's own `.s`, which only an ATTACHED
      # slot can see, so they are attached to the unit that owns them.
      # (Round 14's shared-slot dance, docs/PARALLEL-RUNS.md Gate 2.)
      - [0xFD8, rodata]   # D_800107D8, D_800107F4 -> code_179d8_q / _h, NOT ours
      - [0x1010, .rodata, cd/CdDriver]   # jtbl_80010810, jtbl_80010828
      # ROUND 34 (head): libcd/sys's .rdata is the 5-byte "none" at 0x1040
      # (vram 0x80010840, D_80010840 -- referenced only from sys's own text).
      # It ends at 0x1045; retail has three zero bytes and the plain
      # remainder resumes at 0x1048, so the SUBALIGN(2) `pad` rule applies
      # (docs/SDK-OBJECTS-GUIDE.md step 4) or the remainder lands at 0x1046.
      - [0x1040, o, libcd/sys, .rdata]
      - [0x1045, pad]
      - [0x1048, rodata]  # code_179d8 head remainder continues ("CdlReadS"... strings)
      # jtbl_800109F8 belongs to func_80029478, which lives in the
      # code_179d8_b slice. Its words are `.L` labels LOCAL to that
      # function's own `.s`, so this sub-slot must be ATTACHED to the unit or
      # the link fails with `undefined reference to '.L800296D4'`. The words
      # either side belong to other slices of the same monolith and stay
      # standalone. Survey before moving a boundary here: of the 483 words in
      # the original 0xFD8..0x1764 slot, 179 are vram addresses inside
      # code_179d8's own text and the rest are ASCII.
      - [0x11F8, .rodata, psyq/libcd_bios]
      - [0x120C, rodata]  # was 'code_179d8_mid remainder'; that text
                          # segment is now the code_179d8_n C unit, which
                          # owns no jump table, so this slot stays
                          # STANDALONE and attaches to nothing.
      # ROUND 34 (head): libcd/iso9660's .rdata -- its CdSearchFile /
      # CD_newmedia / CD_cachefile diagnostic strings, 0x1EA bytes, no
      # relocations -- is 0x12EC..0x14D6 (vram 0x80010AEC..).  Retail has two
      # zero bytes before code_179d8_c_b's jump table at 0x14D8, hence the pad
      # (SUBALIGN(2); docs/SDK-OBJECTS-GUIDE.md step 4).
      - [0x12EC, o, libcd/iso9660, .rdata]
      - [0x14D6, pad]
      # jtbl_80010CD8 belongs to func_80032588, in the code_179d8_c slice --
      # same situation as 0x11F8 above.
      - [0x14D8, .rodata, libsnd_ssinit_libapi_counter]
      # 0x14F0 holds EXACTLY three jump tables and nothing else --
      # jtbl_80010CF0 (func_80034690) and jtbl_80010ED8 + jtbl_80010F38
      # (func_800357B0, a double switch), all three in the code_179d8_k
      # slice below and referenced from NOWHERE else (checked per symbol
      # with `grep -rl` over asm/ and src/, round 24).  So the slot is
      # attached WHOLE: no ownership boundary runs through it and it needs
      # none of the split dance that 0x1908 needs.  Its words are `.L`
      # labels local to those two functions' own `.s` files, so leaving it
      # standalone fails the link with `undefined reference to '.L800346..'`.
      - [0x14F0, .rodata, libsnd_seqread]
      # 0x1764..0x1890 was one plain slot serving psyq_SpuSetMute. Its first
      # 0x40 bytes are EXACTLY jtbl_80010F64 + jtbl_80010F84, the two switch
      # tables of libspu/s_sca's SpuSetCommonAttr: relocated words, so `place`
      # reports `bytes:not-found` and the derived offset landing on the slot's
      # own two dlabels is the evidence. The plain remainder below shrinks as
      # later chunks of the segment land their pieces.
      - [0x1764, o, libspu/s_sca, .rdata]
      - [0x17A4, rodata]  # D_80010FA4 .. D_80011054; owners not placed
      - [0x1878, o, libcd/event, .rdata]  # "CdInit: Init failed\n", 0x15
      # 0x1878 + 0x15 = 0x188D, and the next slot starts at 0x1890. Under the
      # splat script's SUBALIGN(2) the following section would land at 0x188E,
      # three bytes early, so retail's 3-byte hole needs an explicit `pad`.
      - [0x188D, pad]
      # 0x1890 holds three jump tables. jtbl_80011090 and jtbl_800110D0
      # belong to code_2cc8c's first 20-function slice (now a C unit), so
      # that part of the slot must be ATTACHED to it -- a standalone rodata
      # object cannot see the `.L` labels that live inside the unit's own
      # objects. jtbl_80011108 (0x1908) belongs to func_8003FB1C, still in
      # the asm remainder, so the slot is SPLIT rather than attached whole:
      # attaching all of it would move that table into the C unit and break
      # its references the other way. That remainder is renamed by each
      # carve of this block (code_2cc8c_b -> code_2cc8c_c in round 11), so
      # the owning function is named here rather than the segment.
      - [0x1890, .rodata, app/Task]
      # 0x1908 holds jtbl_80011108, func_8003FB1C's jump table. ATTACHED to
      # code_2cc8c_e in round 14 when that segment was carved: its words are
      # `.L` labels LOCAL to func_8003FB1C's own .s file, which a standalone
      # rodata object cannot see, so the link failed with
      # `undefined reference to '.L8003FB98'` exactly as Gate 2 predicts.
      # func_8003FB1C itself stays INCLUDE_ASM (addiu-$at blocked), and the
      # attach is still required -- being INCLUDE_ASM does not embed the
      # table, it only assembles the text.
      # SPLIT, not attached whole -- a new Gate 2 sub-case found in round 14.
      # The slot 0x1908..0x19DC holds BOTH unit-local rodata and rodata owned
      # by a DIFFERENT segment:
      #   0x1908 jtbl_80011108  -> func_8003FB1C   (code_2cc8c_e)
      #   0x1994 D_80011194     -> func_8003FC70   (code_2cc8c_e)
      #   0x19B4 D_800111B4     -> asm/psyq_memset.s
      #   0x19C8 D_800111C8     -> asm/psyq_memset.s
      # Attaching the WHOLE slot to code_2cc8c_e fixed the jump table's
      # `undefined reference to '.L8003FB98'` and immediately broke
      # `D_800111B4`/`D_800111C8` instead: with
      # migrate_rodata_to_functions, an attached slot's symbols migrate into
      # the OWNING unit's functions, and a symbol referenced only from
      # another segment has nowhere to migrate to and drops out of the link.
      # So the slot is split at the ownership boundary.
      # ROUND 34: the attach is GONE, and with it the whole Gate 2 problem the
      # two paragraphs above describe. jtbl_80011108 is func_8003FB1C's jump
      # table, func_8003FB1C is Sony's `Gssub_make_matrix` (libgs/gs_123), and
      # this 0x8C IS that object's own `.rdata` section -- so the table now
      # arrives from the object together with the code that indexes it, and no
      # `.L` label crosses a segment boundary in either direction. `place`
      # reports `bytes:not-found` here, which is the EXPECTED relocated-words
      # case (readelf shows gs_123.o carrying 0x118 bytes of `.rel.rdata` for
      # this 0x8C section); the derived offset landing exactly on the slot's
      # existing dlabel is the confirmation, per the guide's step 2.
      # 0x1908 + 0x8C = 0x1994 exactly, so no `pad` is needed here.
      - [0x1908, o, libgs/gs_123, .rdata]
      # ROUND 20: split at 0x1994 so D_80011194 leaves the ATTACHED part of
      # the slot. While attached, migrate_rodata_to_functions placed it in
      # func_8003FC70's generated .s, so that function could never be C.
      # Standalone, it is an ordinary symbol the C references by name.
      # NOTE the round-14 report's diagnosis was INCOMPLETE: this split alone
      # still fails (339541 bytes off), because D_80011194 is a STRING
      # LITERAL and C that spells the string out emits a SECOND copy. The
      # split is necessary; referencing `extern const char D_80011194[]` is
      # the other half. Both together -> func_8003FC70 matches 35/35.
      # ROUND 34: D_80011194 is Sony's too. func_8003FC70 is `GsSetLightMode`
      # (libgs/gs_108), and this string is that object's own `.rdata` -- 0x1D
      # bytes at 0x1994, byte search agrees with the derived offset. The
      # round-20 note above is now HISTORICAL for this slot: its two findings
      # (split the slot at the ownership boundary; reference a rodata string
      # by SYMBOL, never retype the literal, or you emit a second copy and
      # shift the whole image) are both still true and still general -- what
      # expired is only the conclusion that this particular slot needs to be
      # standalone.
      # 0x1994 + 0x1D = 0x19B1, and the next slot (libc2/sprintf's .rdata)
      # starts at 0x19B4. Under the splat script's SUBALIGN(2) the next
      # section would land at 0x19B2, two bytes early, so retail's 3-byte
      # hole needs an explicit `pad`.
      - [0x1994, o, libgs/gs_108, .rdata]   # D_80011194 "not supported light mode %d\n"
      - [0x19B1, pad]                       # 3 bytes; libc2/sprintf's .rdata is at 0x19B4
      # 0xDC -> 0x1A90 exactly: the old D_800111B4/D_800111C8 slot AND the
      # jtbl_800111DC slot together are libc2/sprintf's own .rdata. Its
      # words are relocated, so `place` reports `bytes:not-found`; the
      # derived offset landing on the slot's existing dlabels is the
      # confirmation.
      - [0x19B4, o, libc2/sprintf, .rdata]
      # jtbl_80011290 (5 words) is code_322b4's switch table, ATTACHED for its
      # `.L` labels; D_800112A4 onward is psyq_36654's (libpress) and stays plain.
      - [0x1A90, .rodata, graphics/Sprite]
      - [0x1AA4, rodata]
      # 0x1B -> 0x1B6B; retail's next string is at 0x1B6C, which is exactly
      # where SUBALIGN(2) puts it, so no pad line is needed.
      - [0x1B50, o, libpress/vlc2, .rdata]
      - [0x1B6C, o, libcd/c_011, .rdata]      # 0x15, "DMA STATUS ERROR %x\n" -> 0x1B81
      - [0x1B81, pad]                         # 3 bytes; the next string ("SND\STANDERD") is at 0x1B84
      - [0x1B84, rodata]
      # jtbl_8001140C -- 10 words, all targets inside func_80049EB4, which
      # the class_39e08 carve moved into C. Attached with the dot form so
      # migrate_rodata_to_functions puts the table in that function's own
      # .s, where its .L labels are in scope. The REST of the old 0x1C0C
      # slot (strings, then jtbl_8001157C and jtbl_80011594, whose targets
      # are at 0x8004Fxxx/0x8005xxx and still live in `asm`) stays a
      # standalone rodata object from 0x1C34.
      - [0x1C0C, .rodata, world/DayTaskStageMap]
      # Slot 0x1C34 is shared by FIVE units. Only the two JUMP TABLES need
      # attaching -- they hold `.L` labels local to class_3bb8c_g's own
      # function .s files, which a standalone rodata object cannot resolve.
      # Every `D_` symbol in the slot is referenced BY SYMBOL and resolves
      # from a standalone object just fine, so attaching the whole slot would
      # strand four other units' data (see PARALLEL-RUNS Gate 2). Ownership,
      # measured one grep per symbol at carve time:
      #   D_80011434  (unreferenced)      D_800114DC  class_3bb8c_c
      #   D_800114E8  class_3bb8c_d       D_800114F8  class_3bb8c_d
      #   D_80011530  class_3bb8c_f       jtbl_8001157C/jtbl_80011594  _g
      #   D_800115D0  (unreferenced)      D_80011610/D_8001161C  class_3bb8c_h
      - [0x1C34, rodata]
      - [0x1D7C, .rodata, ui/TitleMenuTaskObjF]   # jtbl_8001157C + jtbl_80011594
      - [0x1DD0, rodata]
      # Split at the ownership boundary (third instance of the shared-slot
      # case this round -- see PARALLEL-RUNS Gate 2). Ownership, one grep per
      # symbol: jtbl_80011628 -> class_3bb8c_i (its .L labels are local to
      # that unit's own function .s, so it MUST be attached);
      # D_800116A4 unreferenced; D_800116E4 -> class_3bb8c_j, still uncarved,
      # so it must stay in a standalone object.
      - [0x1E28, .rodata, ui/TextEntryItemList]   # jtbl_80011628
      - [0x1EA4, rodata]                   # D_800116A4 / D_800116E4 -> not ours
      # Slot 0x1EF4 has THREE owners, so it splits twice (the shared-slot case
      # from PARALLEL-RUNS Gate 2). Ownership, one grep per symbol:
      #   jtbl_800116F4 -> func_800522DC, class_3bb8c_k  (must be ATTACHED:
      #     its words are .L labels local to that function's own .s)
      #   jtbl_8001174C -> func_80053984, class_3bb8c_l  (same, ATTACHED)
      #   D_8001176C / D_80011778 -> referenced ONLY from func_80057FEC and
      #     func_80058084, both still in the uncarved class_3bb8c_m
      #     remainder, so they must stay in a STANDALONE object -- attaching
      #     them to _l would strand them (nowhere to migrate to).
      - [0x1EF4, .rodata, world/ObjMStyleActor]   # jtbl_800116F4
      - [0x1F6C, rodata]                   # two strings -> remainder, NOT ours
      # JUMP TABLES, and the one rodata slot that MUST stay attached to its
      # unit. Its words are pointers to `.L8005....` labels INSIDE DreamSys's
      # functions -- labels that are local to each function's .s file -- so a
      # standalone rodata object cannot resolve them and the link dies. The
      # dot form plus `migrate_rodata_to_functions` puts each table in the same
      # .s as the switch that uses it, where the label is in scope.
      - [0x1F88, .rodata, world/DreamSys]
      # Jump tables for code_4cd08's switches -- its words point at
      # `.L8005....` labels inside that unit's functions, so it must be
      # attached (the yaml's inherited `# greyman` guess was wrong about
      # which unit owns it).
      - [0x206C, .rodata, world/DreamAux]

      # ---- text -----------------------------------------------------------
      # `psyq_*` blocks are Sony SDK library code compiled into the executable.
      # They are NOT game code: keep them out of the progress denominator
      # (tools/progress.py LIBRARY_RANGES) and off the runner queues until the
      # game's own code is done.
      # A NAME IS A CLAIM, NOT EVIDENCE (revision 18, 2026-09-25): ten psyq_*
      # segments, named for their position between placed Sony objects, held
      # 299 game functions -- BasicClass-table methods and callers of the
      # game's framework -- and were carved into code_<fileoff> units.
      # `.venv/bin/python3 tools/gameinsdk.py --check` keeps every psyq_*
      # segment free of game code; name a new one only after running it.
      # main: the game's own `main()` (func_800118DC) plus a two-word stub.
      # Carved round 47 (2026-09-16).
      #
      # THE TAIL IS SPLIT OFF DELIBERATELY AND THE CARVE DOES NOT WORK
      # WITHOUT IT.  0x219C..0x2258 is the C-runtime startup: it clears bss,
      # sets $gp to 0x8008A808, and `jal`s func_800118DC.  spimdisasm labels
      # it `dlabel` (it ends in four literal non-instruction words), and a
      # `dlabel` inside a `c` segment is emitted to NO file -- so the first
      # attempt at this carve built green once and then failed on the NEXT
      # `make extract` with `can't open asm/nonmatchings/main/func_8001199C.s`.
      # A runner in a fresh worktree would have hit exactly that.  Keeping the
      # tail as its own `asm` segment is what makes the unit reproducible.
      #
      # `crt0` is Sony's, not the game's: word 0x21C0 is `0x24020004` =
      # `addiu $v0, $zero, 4`, and the pinned pipeline emits ONLY the `ori`
      # form for 0 < K < 0x10000 (maspsx --aspsx-version=2.34).  That is the
      # round-39 assembler fingerprint (docs/PARALLEL-RUNS.md Gate 1b, eighth
      # screen).  There is no C that produces it and none should be written.
      - [0x20DC, c, main]
      - [0x219C, asm, crt0]
      # psyq_2258 (0x2258..0x8220) is being converted to linked SDK objects a
      # chunk at a time; the unconverted tail keeps a smaller `asm` segment
      # named for its own start offset.
      - [0x2258, o, _obj/malloc]      # _ExpAllocArea .. calloc (the heap)
      # 0x2864..0x2F68 is func_80012064 ALONE. It was psyq_2864 ("no SDK disc
      # places it") until revision 18 measured it as GAME code: it calls the
      # game's own functions and sits in a game method table. A C unit now.
      - [0x2864, c, graphics/ViewportDraw]
      - [0x2F68, o, libapi/c159]      # SetMem
      - [0x2F78, o, libc2/bcopy]      # bcopy, bzero, bcmp
      - [0x3038, o, libgs/matrix]     # GsInitCoordinate2 .. print_vector
      - [0x3420, o, libc2/printf]     # printf
      - [0x345C, o, libc2/prnt]       # prnt -- the formatter proper
      - [0x3AF8, o, libc2/memchr]     # memchr
      - [0x3B48, o, libc2/strlen]     # strlen
      - [0x3B78, o, libc2/ctype]      # toupper, tolower
      - [0x3BE0, o, libc2/putchar]    # putchar
      - [0x3C88, o, libapi/a53]       # write
      - [0x3C98, o, libgs/gs_134]     # GsGetLs
      - [0x3F6C, o, libgs/gs_127]     # GsDefDispBuff2
      - [0x3FEC, o, libgs/gs_013]     # GsSetOrign
      - [0x4004, o, libgs/2d_sp0]     # GsSortSprite
      - [0x4500, o, libgs/2d_com1]    # _make_packet
      - [0x4594, o, libgs/2d_bg0]     # GsSortBg
      - [0x4D8C, o, libgs/gs_119]     # gte_rotate_z_matrix
      - [0x4E44, o, libgs/gs_120]     # gte_scale_matrix
      - [0x4F68, o, libgs/gs_135]     # GsGetLws
      - [0x5288, o, libgs/2d_box0]    # GsSortBoxFill
      - [0x5360, o, libgs/2d_com0]    # _mk_spr_packet, _mk_xpndsp, _mk_normsp
      - [0x58D0, o, libgte/mtx_00]    # CompMatrix .. ReadColorMatrix
      - [0x62F0, o, libgte/mtx]       # MulMatrix .. SetTransMatrix
      - [0x67B0, o, libgte/cmb_00]    # RotTransPers4
      - [0x6830, o, libgte/reg01]     # ReadSZfifo3 .. ReadGeomScreen
      - [0x68B0, o, libgte/fgo_01]    # RotMatrix
      - [0x6B40, o, libgte/geo]       # RotMatrixZYX_C .. MatrixNormal_2
      - [0x7D70, o, libgte/msc02]     # InvSquareRoot .. MatrixNormal
      - [0x8010, o, libgte/smp_00]    # LightColor .. Lzc -- ends at code_8220
      # code_8220 is 56 functions, and it is the BasicClass block -- most of
      # its symbols are already named (BasicClass__*), so it is the most
      # legible uncarved ground in the game. First 20-function slice,
      # 0x8220..0x8A88, carved to C in round 11; remainder stays asm as
      # code_8220_b. 0x8A88 (func_80018288) is a real boundary --
      # func_80018208 closes `jr $ra; nop` + endlabel and func_80018288
      # opens with its own `addiu $sp, $sp, -0x18`. Checked on both sides:
      # no function has more than one prologue, none touches $sp before
      # allocating, and the three frameless ones (func_80017A9C,
      # func_80017AC8, func_80017EA8) all end in their own `jr $ra`.
