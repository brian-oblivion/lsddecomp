      - [0x570C4, data]                       # 8 bytes no placed object owns
      - [0x570CC, o, libgs/2d_bg0, .data]     # 4 bytes
      - [0x570D0, o, libgte/mtx_00, .data]    # 0x310, ends exactly at 0x573E0
