# LSD: Dream Emulator (PSX, 1998, Asmik Ace / OutSide Directors Company)
# Japanese retail release, SLPS-01556.
#
# THE SEGMENTATION BELOW IS INHERITED FROM FirecatFG's lsddecomp
# (github.com/FirecatFG/lsddecomp) -- see CREDITS.md. It is a set of empirical
# facts about this executable (where the psyq library blocks start, where the
# rodata slots sit, where the game's own code begins), not authored source, and
# it is the single biggest head start this project has.
#
# ADDRESSING. This is a plain PS-X EXE: a 0x800-byte header followed by one
# contiguous image loaded at 0x80010000. So
#
#     file offset = vram - 0x80010000 + 0x800
#
# and the whole file is 0x7B800 bytes. There is no compression, no overlay and
# no bank switching -- every byte of code in the game is in this one file.
name: LSD Dream Emulator
sha1: 76322eeade5ebb22dca57fdeac7d68c30f06308d
options:
  basename: lsdde
  platform: psx
  compiler: GCC

  base_path: ..
  target_path: disk/SLPS_015.56
  asm_path:    asm/
  asset_path:  assets/
  src_path:    src/
  symbol_addrs_path: config/symbols.slps01556.lsdde.txt
  undefined_funcs_auto_path:   config/undefined_funcs_auto.slps01556.lsdde.txt
  undefined_syms_auto_path:    config/undefined_syms_auto.slps01556.lsdde.txt
  ld_script_path: lsdde.ld

  find_file_boundaries: False
  pair_rodata_to_text: False
  migrate_rodata_to_functions: True
  gp_value: 0x8008A808

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    align: 4
    subsegments:
      # ---- rodata slots, paired by hand to the text blocks below ----------
      - [0x800, rodata]   # psyq_2258
      - [0xA8C, rodata]   # code_8220
      - [0xABC, rodata]   # psyq_GsLinkObject4
      - [0xF28, rodata]   # psyq_15d04
      - [0xFA4, rodata]   # code_1677c
      - [0xFD8, rodata]   # code_179d8
      - [0x1764, rodata]
      # 0x1890 holds three jump tables. jtbl_80011090 and jtbl_800110D0
      # belong to code_2cc8c's first 20-function slice (now a C unit), so
      # that part of the slot must be ATTACHED to it -- a standalone rodata
      # object cannot see the `.L` labels that live inside the unit's own
      # objects. jtbl_80011108 (0x1908) belongs to func_8003FB1C, still in
      # the asm remainder, so the slot is SPLIT rather than attached whole:
      # attaching all of it would move that table into the C unit and break
      # its references the other way. That remainder is renamed by each
      # carve of this block (code_2cc8c_b -> code_2cc8c_c in round 11), so
      # the owning function is named here rather than the segment.
      - [0x1890, .rodata, code_2cc8c]
      # 0x1908 holds jtbl_80011108, func_8003FB1C's jump table. ATTACHED to
      # code_2cc8c_e in round 14 when that segment was carved: its words are
      # `.L` labels LOCAL to func_8003FB1C's own .s file, which a standalone
      # rodata object cannot see, so the link failed with
      # `undefined reference to '.L8003FB98'` exactly as Gate 2 predicts.
      # func_8003FB1C itself stays INCLUDE_ASM (addiu-$at blocked), and the
      # attach is still required -- being INCLUDE_ASM does not embed the
      # table, it only assembles the text.
      # SPLIT, not attached whole -- a new Gate 2 sub-case found in round 14.
      # The slot 0x1908..0x19DC holds BOTH unit-local rodata and rodata owned
      # by a DIFFERENT segment:
      #   0x1908 jtbl_80011108  -> func_8003FB1C   (code_2cc8c_e)
      #   0x1994 D_80011194     -> func_8003FC70   (code_2cc8c_e)
      #   0x19B4 D_800111B4     -> asm/psyq_memset.s
      #   0x19C8 D_800111C8     -> asm/psyq_memset.s
      # Attaching the WHOLE slot to code_2cc8c_e fixed the jump table's
      # `undefined reference to '.L8003FB98'` and immediately broke
      # `D_800111B4`/`D_800111C8` instead: with
      # migrate_rodata_to_functions, an attached slot's symbols migrate into
      # the OWNING unit's functions, and a symbol referenced only from
      # another segment has nowhere to migrate to and drops out of the link.
      # So the slot is split at the ownership boundary.
      - [0x1908, .rodata, code_2cc8c_e]
      - [0x19B4, rodata]   # D_800111B4/D_800111C8 -> psyq_memset, NOT ours
      - [0x19DC, rodata]
      - [0x1A90, rodata]
      # jtbl_8001140C -- 10 words, all targets inside func_80049EB4, which
      # the class_39e08 carve moved into C. Attached with the dot form so
      # migrate_rodata_to_functions puts the table in that function's own
      # .s, where its .L labels are in scope. The REST of the old 0x1C0C
      # slot (strings, then jtbl_8001157C and jtbl_80011594, whose targets
      # are at 0x8004Fxxx/0x8005xxx and still live in `asm`) stays a
      # standalone rodata object from 0x1C34.
      - [0x1C0C, .rodata, class_39e08]
      # Slot 0x1C34 is shared by FIVE units. Only the two JUMP TABLES need
      # attaching -- they hold `.L` labels local to class_3bb8c_g's own
      # function .s files, which a standalone rodata object cannot resolve.
      # Every `D_` symbol in the slot is referenced BY SYMBOL and resolves
      # from a standalone object just fine, so attaching the whole slot would
      # strand four other units' data (see PARALLEL-RUNS Gate 2). Ownership,
      # measured one grep per symbol at carve time:
      #   D_80011434  (unreferenced)      D_800114DC  class_3bb8c_c
      #   D_800114E8  class_3bb8c_d       D_800114F8  class_3bb8c_d
      #   D_80011530  class_3bb8c_f       jtbl_8001157C/jtbl_80011594  _g
      #   D_800115D0  (unreferenced)      D_80011610/D_8001161C  class_3bb8c_h
      - [0x1C34, rodata]
      - [0x1D7C, .rodata, class_3bb8c_g]   # jtbl_8001157C + jtbl_80011594
      - [0x1DD0, rodata]
      # Split at the ownership boundary (third instance of the shared-slot
      # case this round -- see PARALLEL-RUNS Gate 2). Ownership, one grep per
      # symbol: jtbl_80011628 -> class_3bb8c_i (its .L labels are local to
      # that unit's own function .s, so it MUST be attached);
      # D_800116A4 unreferenced; D_800116E4 -> class_3bb8c_j, still uncarved,
      # so it must stay in a standalone object.
      - [0x1E28, .rodata, class_3bb8c_i]   # jtbl_80011628
      - [0x1EA4, rodata]                   # D_800116A4 / D_800116E4 -> not ours
      # Slot 0x1EF4 has THREE owners, so it splits twice (the shared-slot case
      # from PARALLEL-RUNS Gate 2). Ownership, one grep per symbol:
      #   jtbl_800116F4 -> func_800522DC, class_3bb8c_k  (must be ATTACHED:
      #     its words are .L labels local to that function's own .s)
      #   jtbl_8001174C -> func_80053984, class_3bb8c_l  (same, ATTACHED)
      #   D_8001176C / D_80011778 -> referenced ONLY from func_80057FEC and
      #     func_80058084, both still in the uncarved class_3bb8c_m
      #     remainder, so they must stay in a STANDALONE object -- attaching
      #     them to _l would strand them (nowhere to migrate to).
      - [0x1EF4, .rodata, class_3bb8c_k]   # jtbl_800116F4
      - [0x1F4C, .rodata, class_3bb8c_l]   # jtbl_8001174C
      - [0x1F6C, rodata]                   # two strings -> remainder, NOT ours
      # JUMP TABLES, and the one rodata slot that MUST stay attached to its
      # unit. Its words are pointers to `.L8005....` labels INSIDE DreamSys's
      # functions -- labels that are local to each function's .s file -- so a
      # standalone rodata object cannot resolve them and the link dies. The
      # dot form plus `migrate_rodata_to_functions` puts each table in the same
      # .s as the switch that uses it, where the label is in scope.
      - [0x1F88, .rodata, DreamSys]
      # Jump tables for code_4cd08's switches -- its words point at
      # `.L8005....` labels inside that unit's functions, so it must be
      # attached (the yaml's inherited `# greyman` guess was wrong about
      # which unit owns it).
      - [0x206C, .rodata, code_4cd08]

      # ---- text -----------------------------------------------------------
      # `psyq_*` blocks are Sony SDK library code compiled into the executable.
      # They are NOT game code: keep them out of the progress denominator
      # (tools/progress.py LIBRARY_RANGES) and off the runner queues until the
      # game's own code is done.
      - [0x20DC, asm, main]
      - [0x2258, asm, psyq_2258]
      # code_8220 is 56 functions, and it is the BasicClass block -- most of
      # its symbols are already named (BasicClass__*), so it is the most
      # legible uncarved ground in the game. First 20-function slice,
      # 0x8220..0x8A88, carved to C in round 11; remainder stays asm as
      # code_8220_b. 0x8A88 (func_80018288) is a real boundary --
      # func_80018208 closes `jr $ra; nop` + endlabel and func_80018288
      # opens with its own `addiu $sp, $sp, -0x18`. Checked on both sides:
      # no function has more than one prologue, none touches $sp before
      # allocating, and the three frameless ones (func_80017A9C,
      # func_80017AC8, func_80017EA8) all end in their own `jr $ra`.
      # Zero `jlabel` and zero `jr $t2`. Four of the 20 are gp_rel-blocked
      # (func_80017A9C, func_80017AC8, func_80017B34, func_80017CFC).
      # The 0xA8C rodata slot does NOT need attaching: measured against the
      # data, all 48 bytes are one printf format string used by
      # BMemPMgrInit, with no text pointers and no `.L` labels, so a
      # standalone rodata object resolves it by symbol. (PARALLEL-RUNS.md
      # Gate 2 previously listed 0xA8C as a text-pointer slot needing
      # attachment; that was wrong, and the carve links green without it.)
      - [0x8220, c, code_8220]
      # code_8220_b: second 20-function slice, 0x8A88..0x9F74.
      # 0x9F74 (func_80019774) is a real boundary -- func_8001974C is a
      # 10-word frameless leaf that ends in its own `jr $ra; nop`, and
      # func_80019774 is the next such leaf, opening `beqz $a1, .L80019790`
      # without ever reading the caller's frame. Checked on both sides: no
      # function in the slice has more than one prologue, and none touches
      # $sp before allocating. THIRTEEN of the 20 are frameless leaves --
      # unusually many, because this is the tail of the BasicClass block
      # and most of them are 5-10 word accessors, which makes it the
      # cheapest ground in the game per function. Zero `jlabel`, zero
      # `jr $t2`, so no rodata slot to attach and no hasm/.word
      # disposition. Blocker census over the slice: 2 of 20 gp_rel-blocked
      # (func_8001844C, func_80018458), zero addiu-$at.
      # ONE OUTLIER TO KNOW ABOUT: func_80018464 is 954 words, by far the
      # largest function in any carved unit. It is not blocked, but it is
      # not cold-runner ground either -- budget it separately.
      - [0x8A88, c, code_8220_b]
      # code_8220_c: third and FINAL slice of the code_8220 block,
      # 0x9F74..0xAD64 (the next segment is psyq_rcpolyf3), 16 functions.
      # Carved round 13. Gate 2 checks, all run before the carve and all
      # clean: no function has more than one `addiu $sp, $sp, -N` prologue
      # (six are frameless leaves, which is normal); zero `jr $t2` BIOS
      # trampolines; zero `alabel`; zero jump tables and zero `.word .L`
      # references, so NO rodata slot needs attaching -- the only symbolic
      # references are plain `%hi/%lo(D_...)` globals; and the segment ends
      # on a segment boundary, so there is no data tail to declare.
      # Blocker profile: 14 of 16 functions clean, only func_8001A380
      # (4 hits) and func_8001A54C (2 hits) are gp_rel-blocked.
      - [0x9F74, c, code_8220_c]
      - [0xAD64, asm, psyq_rcpolyf3]
      - [0xB0D4, asm, psyq_rcpolyf4]
      - [0xB554, asm, psyq_rcpolyg3]
      - [0xC2B4, asm, psyq_rcpolyft3]
      - [0xC7D4, asm, psyq_rcpolygt3]
      # code_d294 is 55 functions. First 20-function slice, 0xD294..0xDC24,
      # carved to C in round 11; the remainder stays asm as code_d294_b.
      # 0xDC24 (func_8001D424) is a real boundary -- func_8001D3F8 closes
      # `jr $ra; nop` + endlabel and func_8001D424 opens with its own
      # `addiu $sp, $sp, -0x18`. Checked on both sides: no function in the
      # slice has more than one prologue, and none touches $sp before
      # allocating. The one frameless function (func_8001D33C) is a bare
      # `jr $ra; nop` leaf. Blocker census over the slice: zero gp_rel,
      # zero addiu-$at, zero `jlabel`, zero `jr $t2` -- so no rodata slot
      # to attach and no hasm/.word disposition.
      - [0xD294, c, code_d294]
      # code_d294_b: second 20-function slice, 0xDC24..0xED8C.
      # 0xED8C (func_8001E58C) is a real boundary -- func_8001E57C is a
      # 4-word leaf that returns `&D_8006B5CC` and ends `jr $ra; nop`, and
      # func_8001E58C opens with its own `addiu $sp, $sp, -0x40`. Checked
      # on both sides: no function in the slice has more than one
      # prologue, and none touches $sp before allocating. The four
      # frameless functions (func_8001D6A4, func_8001D6AC, func_8001E49C,
      # func_8001E57C) are 2-4 word leaves, each ending in its own
      # `jr $ra`. Zero `jlabel`, zero `jr $t2`, so no rodata slot to
      # attach and no hasm/.word disposition. Blocker census over the
      # slice: 1 of 20 gp_rel-blocked (func_8001DDF4), zero addiu-$at.
      - [0xDC24, c, code_d294_b]
      # code_d294_c: third and FINAL slice of the code_d294 block,
      # 0xED8C..0xF770 (psyq_GsLinkObject4 follows), 15 functions.
      # Carved round 13. Gate 2 checks, all run before the carve and all
      # clean: no function has more than one `addiu $sp, $sp, -N` prologue;
      # zero `jr $t2` BIOS trampolines; zero `alabel`; zero jump tables and
      # zero `.word .L` references, so NO rodata slot needs attaching; and
      # the segment ends on a segment boundary, so there is no data tail.
      # Blocker profile, all THREE screens: 13 of 15 clean. func_8001EF60
      # is gp_rel-blocked (2 hits). func_8001EC84 is nop_mflo_mfhi-blocked
      # -- caught by the head-side Gate 1 screen added this round, and it
      # is one of the 7 uncarved hits that addiu-at-blocker.md predicted
      # would become queued as carving proceeds. Both carry stub reports.
      # Note func_8001EACC lives here: the function whose first two
      # arguments are symmetric with `$a3` selecting direction (see
      # DECOMPILATION_LEARNINGS and docs/match-reports/func_80061778.md).
      - [0xED8C, c, code_d294_c]
      - [0xF770, asm, psyq_GsLinkObject4]
      - [0x15D04, asm, psyq_15d04]
      - [0x16334, c, class_16334]
      - [0x166ac, asm, psyq_PadInit]
      - [0x1677c, c, code_1677c]
      - [0x171e0, c, code_171e0]
      - [0x179d8, asm, code_179d8]
      - [0x272c8, asm, psyq_SpuSetMute]
      - [0x2c054, c, code_2c054]
      # code_2cc8c is 153 functions. Round 10 carved the first 20-function
      # slice (0x2CC8C..0x2D548) as a C unit; the remainder stays asm as
      # code_2cc8c_b. Blocker census at carve time: 4 of 153 functions
      # (3%) hit the gp_rel / addiu-$at blockers -- the lowest density of
      # any uncarved segment, which is why this block was picked over the
      # larger code_179d8 (43% blocked).
      - [0x2cc8c, c, code_2cc8c]
      # code_2cc8c_b: second 20-function slice, 0x2D548..0x2E7A0.
      # 0x2E7A0 (func_8003DFA0) is a real boundary -- func_8003DE9C closes
      # `jr $ra; nop` + endlabel, and func_8003DFA0 opens by loading through
      # its own $a0, never through the caller's frame. Checked on both
      # sides: no function in the slice has more than one
      # `addiu $sp, $sp, -N`, and none touches $sp before allocating.
      # The one frameless function (func_8003D5C0) is a two-instruction
      # leaf that ends in its own `jr $ra`, not a fall-through orphan.
      # HIGHEST-YIELD SLICE OF THIS ROUND: zero gp_rel and zero addiu-$at
      # hits across all 20 functions, and zero `jlabel`/`jr $t2`, so no
      # rodata slot needs attaching and no hasm/.word disposition applies.
      - [0x2D548, c, code_2cc8c_b]
      # code_2cc8c_c: third 20-function slice, 0x2E7A0..0x2F0B8.
      # 0x2F0B8 (func_8003E8B8) is a real boundary -- func_8003E874 closes
      # `addiu $sp, $sp, 0x18; jr $ra; nop` and func_8003E8B8 opens with
      # its own `addiu $sp, $sp, -0x20`. Checked on both sides: no
      # function in the slice has more than one prologue, and none touches
      # $sp before allocating. The six frameless functions in it
      # (func_8003DFA0, func_8003DFBC, func_8003DFCC, func_8003E100,
      # func_8003E4A4, func_8003E5C8) are 3-7 word leaves ending in their
      # own `jr $ra`.
      # BEST SLICE OF ROUND 12: ZERO gp_rel and ZERO addiu-$at across all
      # 20 functions, and zero `jlabel`/`jr $t2`. The segment's only jump
      # table belongs to func_8003FB1C, the 60th function -- still deep in
      # the asm remainder, where the yaml already parks its rodata slot at
      # 0x1908. So nothing to attach and no hasm/.word disposition; that
      # decision lands on whoever carves past function 59.
      - [0x2E7A0, c, code_2cc8c_c]
      # code_2cc8c_d: first slice of the 93-function code_2cc8c remainder,
      # 0x2F0B8..0x2FAAC, 33 functions. Carved round 13.
      #
      # Sized by NON-TRIVIAL function count, not raw count: 9 of the 33 are
      # 2-instruction `jr $ra; nop` bodies that splat generated itself and
      # that are matches without being work (see CLAUDE.md, "Not every
      # matched function was work"). Real content is 21 clean non-trivial
      # functions plus 2 blocked ones.
      #
      # Gate 2 checks over the slice, all clean: no function has more than
      # one `addiu $sp, $sp, -N` prologue; zero `jr $t2` BIOS trampolines;
      # zero `alabel`; and zero jump tables or `.word .L` references, so no
      # rodata slot needs attaching HERE.
      #
      # Blocker profile, all three screens plus the register screen:
      # func_8003E968 is gp_rel-blocked, func_8003EC2C is
      # nop_mflo_mfhi-blocked (a second uncarved hit from
      # docs/research/addiu-at-blocker.md turning into a queued one). Both
      # carry stub reports. Nothing in the slice demands 5+ callee-saved
      # registers.
      - [0x2F0B8, c, code_2cc8c_d]
      # code_2cc8c_e: the remaining 60 functions, 0x2FAAC.. -- left UNCARVED
      # deliberately, so whoever carves it screens it themselves.
      #
      # TWO things already measured about it, to save that person the work:
      #   * func_8003F2AC (0x2FAAC, 242 instructions, the segment's first)
      #     is nop_mflo_mfhi-blocked AND demands 6 callee-saved registers.
      #     It is the worst function in the whole remainder on both screens;
      #     do not lead a runner with it.
      #   * func_8003FB1C (0x3031C) is addiu_at-blocked and owns a real
      #     jump table (`jtbl_80011108`). Its rodata slot WILL need
      #     attaching when this segment is carved -- that is the
      #     `undefined reference to '.LXXXXXXXX'` failure in Gate 2. Survey
      #     the slot at carve time rather than trusting this comment.
      # code_2cc8c_e / _f: the 60-function code_2cc8c remainder, carved as
      # two 30-function C units in round 14. Best blocker density of any
      # uncarved ground measured this round: 2 of 60 (3.3%).
      #
      # code_2cc8c_e: #0..#29, 0x2FAAC..0x30E64. Contains BOTH of the
      # segment's blocked functions, already measured in round 13:
      #   * func_8003F2AC (0x2FAAC, 242 instructions) -- nop_mflo_mfhi
      #     blocked AND wants 6 callee-saved registers. The worst function in
      #     the whole remainder on both screens; do not lead a runner with it.
      #   * func_8003FB1C (0x3031C) -- addiu-$at blocked, and it owns a real
      #     jump table (jtbl_80011108). Its rodata slot is declared
      #     standalone at 0x1908; if the link fails with
      #     `undefined reference to '.LXXXXXXXX'`, attach it as
      #     `- [0x1908, .rodata, code_2cc8c_e]`.
      - [0x2FAAC, c, code_2cc8c_e]
      # code_2cc8c_f: #30..#59, 0x30E64..0x3197C (psyq_memset follows, so no
      # data tail). Zero blocked functions.
      - [0x30E64, c, code_2cc8c_f]
      - [0x3197c, asm, psyq_memset]
      - [0x39c80, asm, psyq_rand]

      # ---- carved C units --------------------------------------------------
      # These are the units runners work in. Everything else is still a
      # monolithic `asm` segment awaiting a carve (docs/PARALLEL-RUNS.md
      # Gate 2).
      - [0x39cb4, c, StageGrid]
      - [0x39e08, c, class_39e08]
      - [0x3ac78, c, class_3ac78]
      # class_3bb8c is 365 functions -- the largest uncarved block in the
      # game, and the one holding all 13 PSX BIOS trampolines (`jr $t2`,
      # not expressible in C). Carved in slices from the front, like Entity.
      # 0x3CD88 (func_8004C588) is a real boundary: func_8004C470 ends in
      # `jr $ra` and func_8004C588 opens with `addu $a3, $zero, $zero` --
      # a leaf that never allocates a frame, not a pre-prologue fragment.
      # This first slice carries NO switch jump tables (zero `jlabel`s in
      # the 20 functions) and none of the BIOS stubs, so no rodata slot
      # needs attaching and no `hasm`/`.word` disposition is required yet.
      # BOTH are still ahead in the remainder: whoever carves the next
      # slice must decide the BIOS-stub disposition AT CARVE TIME.
      - [0x3bb8c, c, class_3bb8c]
      # class_3bb8c_b: second 20-function slice, 0x3CD88..0x3DA54.
      # 0x3DA54 (func_8004D254) is a real boundary -- func_8004D244 is a
      # two-instruction `jr $ra` leaf that ends cleanly, and func_8004D254
      # opens with its own `addiu $sp, $sp, -0x18`. Checked on both sides:
      # no function in the slice has more than one `addiu $sp, $sp, -N`
      # prologue, and none touches $sp before allocating its own frame.
      # The seven zero-prologue functions in it (func_8004C588,
      # func_8004C5D0, func_8004CD38, func_8004CFA8, func_8004CFB0,
      # func_8004CFB8, func_8004D244) are ordinary frameless leaves, not
      # pre-prologue fragments -- each ends in its own `jr $ra`.
      # STILL CLEAR of both hazards the remainder carries: the segment's
      # first `jlabel` is at 0x8004FC78 and its first BIOS trampoline
